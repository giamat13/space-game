name: Deploy test
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp -R js css assets data deploy/
          # main's .gitignore ignores *.png; this nested rule lets the images reach test/assets
          printf '!*.png\n' > deploy/.gitignore

      - name: Deploy to Subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          target-folder: test
          branch: main # זה ידחוף את התיקייה לתוך ה-test שלך
